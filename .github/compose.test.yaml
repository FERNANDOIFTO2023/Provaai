# CI / ambiente isolado
# Sobrescreve o Compose para validar instalação e migração no CI. Os dados desse ambiente são de teste e não devem apontar para serviços de produção.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: provaai
      POSTGRES_DB: provaai
      POSTGRES_PASSWORD: fixture-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provaai"]
      interval: 2s
      timeout: 3s
      retries: 20
