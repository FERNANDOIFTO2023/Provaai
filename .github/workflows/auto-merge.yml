# CI / integração após aprovação
# Agenda a integração do PR quando as exigências do GitHub forem satisfeitas. Por usar pull_request_target com permissão de escrita, nunca deve executar código fornecido pelo PR.
name: Enable auto-merge after approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nunca faça checkout nem execute código do PR com este token privilegiado.
      # O GitHub exige a aprovação do proprietário e as verificações obrigatórias antes da integração.
      - name: Schedule merge when all requirements pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash --match-head-commit "$PR_HEAD_SHA"
