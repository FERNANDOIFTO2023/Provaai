name: Validate Laravel and frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci --include=optional
      - run: cp .env.example .env && php artisan key:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: php artisan test
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated configuration
        run: |
          cat > .env.production <<EOF
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://127.0.0.1:8080
          DB_CONNECTION=pgsql
          DB_HOST=postgres
          DB_DATABASE=provaai
          DB_USERNAME=provaai
          DB_PASSWORD=fixture-only
          DB_SCHEMA=provaai
          MAIL_MAILER=array
          EOF
      - name: Build the production image and migrate an empty PostgreSQL schema
        run: |
          docker compose -f compose.yaml -f .github/compose.test.yaml up -d --wait postgres
          docker compose -f compose.yaml -f .github/compose.test.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U provaai -c 'CREATE SCHEMA provaai'
          docker compose build app
          docker compose run --rm app php artisan migrate --force
          docker compose up -d app
          curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://127.0.0.1:8080/up
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          docker compose exec -T app composer check-platform-reqs --no-dev
      - name: Check legacy import and document conversion in the built image
        run: |
          docker compose exec -T --user www-data app sh -eu <<'SH'
          cd /var/www/html
          echo '{"version":1,"users":[{"id":"10000000-0000-4000-8000-000000000001","email":"docente@example.test","name":"Docente"}],"tables":{},"files":[]}' > /tmp/legacy.json
          php artisan provaai:import-legacy /tmp/legacy.json
          php artisan provaai:import-legacy /tmp/legacy.json --apply
          echo '{"operation":"header","templatePath":"tests/fixtures/model.pdf","ratio":0.25}' > /tmp/header.json
          node --experimental-strip-types scripts/render-document.mjs /tmp/header.json > /tmp/header-result.json
          node -e "if (!JSON.parse(require('fs').readFileSync('/tmp/header-result.json')).image) process.exit(1)"
          SH
          test "$(docker compose -f compose.yaml -f .github/compose.test.yaml exec -T postgres psql -At -U provaai -c 'SELECT count(*) FROM provaai.users')" = 1
      - if: failure()
        run: docker compose logs --tail 50 app
