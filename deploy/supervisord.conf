[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
[program:php]
command=php-fpm -F
autorestart=true
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=1 --tries=1 --timeout=130
user=www-data
autorestart=true
stopwaitsecs=140
[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
