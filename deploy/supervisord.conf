# Operação / processos da aplicação
# Mantém PHP-FPM, Nginx, trabalhador de fila e agendador em execução. Os tempos de encerramento permitem concluir uma etapa antes de interromper o trabalhador.
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
[program:php]
command=php-fpm -F
autorestart=true
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=1 --tries=1 --timeout=130
user=www-data
autorestart=true
stopwaitsecs=140
[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true

# Um conversor de preparação por contêiner evita disparar vários motores ao aprovar um lote.
# A reserva da conexão documents (480 s) precisa superar este timeout (420 s).
[program:documents]
command=php /var/www/html/artisan queue:work documents --queue=documents --sleep=1 --tries=1 --timeout=420
user=www-data
autorestart=true
stopwaitsecs=430
stopasgroup=true
killasgroup=true
