<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu código de acesso à Provaai</title>
  <style>
    @media only screen and (max-width:480px) {
      .outer { padding: 16px 8px !important; }
      .panel { padding: 24px 18px !important; }
      .token { font-size: 28px !important; letter-spacing: 1px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#F5F3F5;color:#0D1823;font-family:'Segoe UI',Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Digite este código na tela de acesso da Provaai.</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F5F3F5">
    <tr><td class="outer" align="center" style="padding:36px 12px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:500px;">
        <tr><td>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
            <td width="72%" height="6" bgcolor="#5210CE" style="font-size:1px;line-height:6px;">&nbsp;</td>
            <td height="6" bgcolor="#2ADFB8" style="font-size:1px;line-height:6px;">&nbsp;</td>
          </tr></table>
        </td></tr>
        <tr><td class="panel" bgcolor="#0D1823" style="padding:30px 32px 32px;border-radius:0 0 20px 20px;color:#F5F3F5;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr>
            <td width="34" height="27" align="center" valign="middle" bgcolor="#2ADFB8" style="border-radius:50% 58% 44% 47%;font-family:Arial,sans-serif;font-weight:bold;color:#0D1823;font-size:14px;line-height:27px;">&#10074;&#8201;&#10074;</td>
            <td style="padding-left:9px;color:#F5F3F5;font:bold 34px/1 'Trebuchet MS',Arial,sans-serif;letter-spacing:-2px;">Provaai<span style="color:#2ADFB8;">.</span></td>
          </tr></table>
          <h1 style="margin:30px 0 10px;color:#F5F3F5;font:bold 29px/1.15 'Trebuchet MS',Arial,sans-serif;">Seu código de acesso</h1>
          <p style="margin:0 0 22px;color:#E0E4E7;font-size:16px;line-height:1.5;">Volte à tela de login da Provaai e digite o código abaixo para entrar.</p>
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
            <td class="token" align="center" dir="ltr" bgcolor="#2ADFB8" style="padding:16px 4px;border-radius:12px;color:#0D1823;font:bold 34px/1.25 Consolas,'Courier New',monospace;letter-spacing:2px;">{{ .Token }}</td>
          </tr></table>
          <p style="margin:22px 0 0;color:#E0E4E7;font-size:14px;line-height:1.5;">Se você pediu mais de um código, use o mais recente.</p>
        </td></tr>
        <tr><td style="padding:18px 12px;color:#505866;font-size:13px;line-height:1.5;text-align:center;">Se você não solicitou este acesso, ignore este e-mail.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
