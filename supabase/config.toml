project_id = "provaai"

[auth.email]
max_frequency = "10m"
otp_expiry = 600

# O endpoint emite sessões após validar o código no servidor.
[functions.provaai-auth]
verify_jwt = false
import_map = "./functions/provaai-auth/deno.json"

# Cada função valida o token do usuário com auth.getUser antes de processar dados.
[functions.sala-ai]
verify_jwt = false
import_map = "./functions/sala-ai/deno.json"

[functions.sala-ai-mistral]
verify_jwt = false
import_map = "./functions/sala-ai-mistral/deno.json"
